<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clipper Pro - Layout & Hook</title>
    <style>
        body { 
            font-family: sans-serif; 
            text-align: center; 
            padding: 10px; 
            background-color: #121212; 
            color: white;
            margin: 0;
        }
        .judul { font-size: 20px; font-weight: bold; margin-bottom: 15px; color: #00e5ff; }
        video { width: 100%; max-width: 400px; border-radius: 8px; background-color: #222; }
        
        canvas { 
            width: 100%; 
            max-width: 280px; 
            background-color: black; 
            border: 2px solid #00e5ff;
            border-radius: 10px;
            margin-top: 10px;
        }
        
        .grup-tombol { margin: 15px 0; display: flex; justify-content: center; gap: 10px; }
        .btn-layout {
            padding: 8px 12px; border-radius: 5px; border: 1px solid #444; 
            background-color: #2a2a2a; color: white; font-weight: bold;
        }
        .btn-layout.aktif { background-color: #00e5ff; color: black; }
        
        .tombol-waktu { background-color: #007bff; color: white; border: none; padding: 10px; border-radius: 5px; margin: 5px; }
        .tombol-potong { 
            padding: 15px; font-size: 16px; border-radius: 8px; background-color: #ff0050; 
            color: white; border: none; margin-top: 15px; font-weight: bold; width: 100%; max-width: 400px;
        }
        .kotak-area { background-color: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        
        /* Gaya baru untuk input Hook */
        .input-hook {
            width: 90%; padding: 12px; border-radius: 8px; border: none; 
            font-weight: bold; text-align: center; font-size: 16px; margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="judul">Clipper Studio: Pro</div>
    
    <input type="file" id="inputVideo" accept="video/*" style="margin-bottom:15px;">
    
    <!-- 1. Area Video Asli -->
    <div class="kotak-area">
        <p style="margin:0 0 10px 0; color:#aaa; font-size:14px;">1. Video Asli (Gunakan untuk geser waktu)</p>
        <video id="pemutarVideo" controls></video>
        
        <div style="margin-top:10px;">
            <button id="btnSetMulai" class="tombol-waktu">Mulai: <span id="teksMulai">0.0</span>s</button>
            <button id="btnSetSelesai" class="tombol-waktu">Selesai: <span id="teksSelesai">0.0</span>s</button>
        </div>
    </div>

    <!-- 2. Teks Hook -->
    <div class="kotak-area">
        <p style="margin:0 0 10px 0; color:#aaa; font-size:14px;">2. Tulis Hook Judul (Real-time)</p>
        <input type="text" id="inputHook" class="input-hook" placeholder="Ketik judul pancingan di sini...">
        <div>
            <label style="font-size:14px; color:#aaa; vertical-align: super;">Warna Teks: </label>
            <!-- Warna awal disetel Kuning khas konten kreator -->
            <input type="color" id="warnaTeks" value="#ffff00" style="border: none; background: none; width: 35px; height: 35px;">
        </div>
    </div>

    <!-- 3. Area Preview -->
    <div class="kotak-area">
        <p style="margin:0 0 10px 0; color:#aaa; font-size:14px;">3. Pilih Bingkai & Preview (9:16)</p>
        <div class="grup-tombol">
            <button id="lay1" class="btn-layout aktif">1 Orang</button>
            <button id="lay2" class="btn-layout">2 Orang</button>
            <button id="lay3" class="btn-layout">3 Orang</button>
        </div>
        <canvas id="kanvasVideo" width="720" height="1280"></canvas>
    </div>

    <button id="tombolPotong" class="tombol-potong">✂️ EXPORT VIDEO VERTICAL!</button>

    <script src="app.js"></script>
</body>
</html>
